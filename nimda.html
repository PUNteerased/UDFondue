<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDFondue | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #eef2f7; }

        #detailModalPanel {
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #detailModalPanel.is-open { transform: translateY(0); }
        #detailModalBackdrop {
            opacity: 0;
            transition: opacity 0.28s ease;
        }
        #detailModalBackdrop.is-open { opacity: 1; }

        #editModalPanel {
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #editModalPanel.is-open { transform: translateY(0); }
        #editBackdrop {
            opacity: 0;
            transition: opacity 0.28s ease;
        }
        #editBackdrop.is-open { opacity: 1; }
        @media (min-width: 640px) {
            #editModalPanel { transform: translateY(12px) scale(0.98); opacity: 0; }
            #editModalPanel.is-open { transform: translateY(0) scale(1); opacity: 1; }
        }

        #imageLightbox {
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        #imageLightbox.is-open { opacity: 1; }
        #imageLightboxImg {
            transform: scale(0.92);
            transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #imageLightbox.is-open #imageLightboxImg { transform: scale(1); }

        .admin-image {
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .admin-image.is-loaded { opacity: 1; }
        .admin-image-skeleton { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-100 text-blue-800 mb-3">
                    <i class="fa-solid fa-user-shield text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800">UDFondue Admin</h1>
                <p class="text-sm text-gray-400 mt-1">เข้าสู่ระบบเจ้าหน้าที่</p>
            </div>
            <input type="password" id="adminPassword" placeholder="รหัสผ่าน Admin"
                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-800/20 focus:border-blue-800 outline-none mb-4">
            <button type="button" id="loginBtn"
                class="w-full bg-gradient-to-r from-blue-900 to-blue-700 text-white font-semibold py-3 rounded-xl hover:from-blue-950 hover:to-blue-800 transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                เข้าสู่ระบบ
            </button>
            <p id="loginError" class="hidden text-sm text-red-500 text-center mt-3"></p>
        </div>
    </div>

    <div id="adminScreen" class="hidden min-h-screen flex flex-col">
        <div class="bg-gradient-to-r from-blue-900 to-blue-700 text-white px-6 py-5">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold">จัดการเรื่องแจ้ง</h1>
                    <p class="text-xs text-blue-100 mt-0.5">UDFondue Admin Panel</p>
                </div>
                <button type="button" id="logoutBtn" class="text-sm bg-white/20 px-3 py-1.5 rounded-lg hover:bg-white/30 transition-colors">
                    ออกจากระบบ
                </button>
            </div>
        </div>

        <div class="max-w-4xl mx-auto w-full px-4 py-5 flex-1">
            <div class="flex flex-col sm:flex-row gap-2 mb-4">
                <select id="filterStatus" class="px-4 py-2.5 rounded-xl border border-gray-200 bg-white outline-none text-sm">
                    <option value="">ทุกสถานะ</option>
                </select>
                <input type="text" id="searchInput" placeholder="ค้นหา ชื่อ / ห้อง / เลขที่แจ้ง..."
                    class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 outline-none text-sm focus:border-blue-800">
                <button type="button" id="refreshBtn" class="px-4 py-2.5 rounded-xl bg-blue-800 text-white text-sm font-semibold hover:bg-blue-900">
                    <i class="fa-solid fa-rotate-right"></i> รีเฟรช
                </button>
            </div>

            <div id="listLoading" class="text-center py-12 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
            </div>
            <div id="reportList" class="space-y-3"></div>
        </div>
    </div>

    <div id="detailModal" class="hidden fixed inset-0 z-50">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="detailBackdrop"></div>
        <div class="absolute bottom-0 sm:bottom-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 left-0 right-0 bg-white sm:rounded-3xl sm:max-w-lg sm:w-full rounded-t-3xl max-h-[92vh] overflow-y-auto" id="detailModalPanel">
            <div class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between z-10">
                <h3 class="font-bold text-gray-800">รายละเอียดเรื่อง</h3>
                <button type="button" id="closeDetail" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="detailContent" class="px-6 py-4 pb-6 space-y-4"></div>
            <div class="sticky bottom-0 bg-white border-t px-6 py-4 flex gap-2">
                <button type="button" id="detailEditBtn"
                    class="flex-1 bg-gradient-to-r from-blue-900 to-blue-700 text-white font-semibold py-3 rounded-xl hover:from-blue-950 transition-all">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> อัปเดตสถานะ
                </button>
                <button type="button" id="detailCloseBtn"
                    class="px-5 py-3 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50">
                    ปิด
                </button>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="hidden fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4">
        <button type="button" id="closeLightbox" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/15 text-white flex items-center justify-center hover:bg-white/25">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <img id="imageLightboxImg" src="" alt="รูปเต็มจอ" class="max-w-full max-h-[90vh] object-contain rounded-lg">
    </div>

    <div id="editModal" class="hidden fixed inset-0 z-[55]">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="editBackdrop"></div>
        <div class="absolute bottom-0 sm:bottom-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 left-0 right-0 bg-white sm:rounded-3xl sm:max-w-lg sm:w-full rounded-t-3xl max-h-[90vh] overflow-y-auto" id="editModalPanel">
            <div class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
                <h3 class="font-bold text-gray-800">อัปเดตสถานะ</h3>
                <button type="button" id="closeEdit" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div id="editSummary" class="text-sm text-gray-600 bg-gray-50 rounded-xl p-3"></div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">สถานะ</label>
                    <select id="editStatus" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 outline-none"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">หมายเหตุเจ้าหน้าที่</label>
                    <textarea id="editNote" rows="3" placeholder="ข้อความถึงนักเรียน (ถ้ามี)..."
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 outline-none resize-none"></textarea>
                </div>
                <button type="button" id="saveBtn"
                    class="w-full bg-gradient-to-r from-blue-900 to-blue-700 text-white font-semibold py-3 rounded-xl hover:from-blue-950 transition-all">
                    บันทึก
                </button>
            </div>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7enhoj1gHCAzzVIq-gm4_3PkFbRk3o3Ex8-rfQ4eClGpsrg44RAN0vnpg4JEIYSY/exec";

        let adminToken = sessionStorage.getItem("udfondue_admin_token") || "";
        let statusOptions = [];
        let currentEditId = "";
        let currentReport = null;

        const STATUS_COLORS = {
            "รับเรื่องแล้ว": "bg-blue-100 text-blue-800",
            "กำลังดำเนินการ": "bg-amber-100 text-amber-800",
            "รอข้อมูลเพิ่ม": "bg-orange-100 text-orange-800",
            "เสร็จสิ้น": "bg-green-100 text-green-800",
            "ปิดเรื่อง": "bg-gray-200 text-gray-700"
        };

        async function postToGas(payload) {
            const response = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            return response.json();
        }

        function escapeHtml(str) {
            return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatSubmitIdDisplay(id) {
            const s = String(id || "");
            if (s.indexOf("-U") !== -1) return s.split("-")[0];
            return s;
        }

        function statusBadge(status) {
            const cls = STATUS_COLORS[status] || "bg-gray-100 text-gray-700";
            return '<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ' + cls + '">' + escapeHtml(status) + '</span>';
        }

        function toEmbeddableDriveUrl(url) {
            const s = String(url || "").trim();
            if (s.indexOf("drive.google.com/thumbnail") !== -1) return s;
            const m = s.match(/\/file\/d\/([^/]+)/) || s.match(/[?&]id=([^&]+)/);
            if (m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200";
            return s;
        }

        function getDriveViewerUrl(url) {
            const s = String(url || "").trim();
            const m = s.match(/\/file\/d\/([^/]+)/) || s.match(/[?&]id=([^&]+)/);
            if (m) return "https://drive.google.com/file/d/" + m[1] + "/view";
            return s;
        }

        function buildImagesHtml(imageUrl) {
            const raw = String(imageUrl || "").trim();
            if (!raw || raw === "กำลังอัปโหลด...") {
                if (raw === "กำลังอัปโหลด...") {
                    return '<div class="text-sm text-amber-700 bg-amber-50 rounded-xl p-3"><i class="fa-solid fa-clock mr-1"></i> รูปกำลังอัปโหลดหรืออัปโหลดไม่สำเร็จ</div>';
                }
                return "";
            }

            const images = raw.split("\n").filter(function (u) {
                return u && u.indexOf("http") === 0;
            });
            if (images.length === 0) {
                if (raw.indexOf("อัปโหลดรูปไม่สำเร็จ") !== -1) {
                    return '<div class="text-sm text-red-600 bg-red-50 rounded-xl p-3">' + escapeHtml(raw) + '</div>';
                }
                return "";
            }

            let html = '<div class="space-y-3"><p class="text-sm font-semibold text-gray-700"><i class="fa-regular fa-image mr-1"></i>รูปภาพ (' + images.length + ')</p>';
            images.forEach(function (rawUrl, idx) {
                const embedUrl = toEmbeddableDriveUrl(rawUrl);
                const viewerUrl = getDriveViewerUrl(rawUrl);
                html +=
                    '<div class="admin-image-wrap relative rounded-xl border border-gray-200 bg-gray-100 overflow-hidden cursor-zoom-in min-h-[120px]"' +
                    ' data-viewer-url="' + escapeHtml(viewerUrl) + '">' +
                    '<div class="admin-image-skeleton absolute inset-0 bg-gray-200"></div>' +
                    '<img src="' + escapeHtml(embedUrl) + '" alt="รูปประกอบ ' + (idx + 1) + '"' +
                    ' class="admin-image relative w-full object-contain max-h-72" loading="lazy" referrerpolicy="no-referrer">' +
                    '<div class="admin-image-error hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-100 text-gray-500 text-sm gap-2">' +
                    '<i class="fa-regular fa-image text-2xl"></i>' +
                    '<a href="' + escapeHtml(viewerUrl) + '" target="_blank" rel="noopener" class="text-blue-700 underline">เปิดใน Drive</a>' +
                    '</div></div>';
            });
            html += '</div>';
            return html;
        }

        function bindAdminImages(container) {
            container.querySelectorAll(".admin-image-wrap").forEach(function (wrap) {
                const img = wrap.querySelector(".admin-image");
                const skeleton = wrap.querySelector(".admin-image-skeleton");
                const errorEl = wrap.querySelector(".admin-image-error");

                function showError() {
                    if (skeleton) skeleton.classList.add("hidden");
                    img.classList.add("hidden");
                    errorEl.classList.remove("hidden");
                }

                img.addEventListener("load", function () {
                    if (skeleton) skeleton.classList.add("hidden");
                    img.classList.add("is-loaded");
                });
                img.addEventListener("error", showError);

                if (img.complete && img.naturalWidth > 0) {
                    if (skeleton) skeleton.classList.add("hidden");
                    img.classList.add("is-loaded");
                } else if (img.complete) {
                    showError();
                }

                wrap.addEventListener("click", function () {
                    if (img.classList.contains("is-loaded")) {
                        openLightbox(img.src);
                    }
                });
            });
        }

        function detailRow(label, value, mono) {
            if (!value) return "";
            return '<div><p class="text-xs text-gray-400 mb-0.5">' + escapeHtml(label) + '</p>' +
                '<p class="text-sm text-gray-800 whitespace-pre-wrap' + (mono ? ' font-mono break-all' : '') + '">' + escapeHtml(value) + '</p></div>';
        }

        function openDetailModal() {
            const modal = document.getElementById("detailModal");
            const backdrop = document.getElementById("detailBackdrop");
            const panel = document.getElementById("detailModalPanel");
            modal.classList.remove("hidden");
            requestAnimationFrame(function () {
                backdrop.classList.add("is-open");
                panel.classList.add("is-open");
            });
        }

        function closeDetailModal() {
            const modal = document.getElementById("detailModal");
            const backdrop = document.getElementById("detailBackdrop");
            const panel = document.getElementById("detailModalPanel");
            backdrop.classList.remove("is-open");
            panel.classList.remove("is-open");
            setTimeout(function () {
                modal.classList.add("hidden");
            }, 320);
        }

        function openEditModal() {
            const modal = document.getElementById("editModal");
            const backdrop = document.getElementById("editBackdrop");
            const panel = document.getElementById("editModalPanel");
            modal.classList.remove("hidden");
            requestAnimationFrame(function () {
                backdrop.classList.add("is-open");
                panel.classList.add("is-open");
            });
        }

        function closeEditModal() {
            const modal = document.getElementById("editModal");
            const backdrop = document.getElementById("editBackdrop");
            const panel = document.getElementById("editModalPanel");
            backdrop.classList.remove("is-open");
            panel.classList.remove("is-open");
            setTimeout(function () {
                modal.classList.add("hidden");
            }, 320);
            currentEditId = "";
        }

        function openLightbox(src) {
            const lb = document.getElementById("imageLightbox");
            const img = document.getElementById("imageLightboxImg");
            img.src = src;
            lb.classList.remove("hidden");
            requestAnimationFrame(function () {
                lb.classList.add("is-open");
            });
        }

        function closeLightbox() {
            const lb = document.getElementById("imageLightbox");
            lb.classList.remove("is-open");
            setTimeout(function () {
                lb.classList.add("hidden");
                document.getElementById("imageLightboxImg").src = "";
            }, 250);
        }

        function showDetail(report) {
            currentReport = report;
            const content = document.getElementById("detailContent");
            const imageBlock = buildImagesHtml(report.imageUrl);

            content.innerHTML =
                '<div class="flex items-center justify-between gap-2 flex-wrap">' +
                statusBadge(report.status) +
                '<span class="text-xs text-gray-400">' + escapeHtml(report.statusUpdated || "") + '</span>' +
                '</div>' +
                detailRow("เลขที่แจ้ง", formatSubmitIdDisplay(report.submitId), true) +
                detailRow("วันที่ / เวลา", (report.date || "") + " " + (report.time || "")) +
                detailRow("ประเภทเรื่อง", report.category) +
                detailRow("ผู้แจ้ง", report.name) +
                detailRow("ห้อง / เลขที่", "ห้อง " + (report.room || "-") + " · เลขที่ " + (report.studentNo || "-")) +
                detailRow("รายละเอียด", report.detail) +
                (report.imageCount > 0 && !imageBlock ? detailRow("จำนวนรูป", String(report.imageCount)) : "") +
                imageBlock +
                (report.adminNote ?
                    '<div class="bg-blue-50 rounded-xl p-3">' +
                    '<p class="text-xs text-blue-800 font-semibold mb-1"><i class="fa-solid fa-user-tie mr-1"></i>หมายเหตุเจ้าหน้าที่</p>' +
                    '<p class="text-sm text-gray-700 whitespace-pre-wrap">' + escapeHtml(report.adminNote) + '</p></div>' : '') +
                detailRow("LINE User ID", report.lineId, true);

            bindAdminImages(content);
            openDetailModal();
        }

        function showLogin() {
            document.getElementById("loginScreen").classList.remove("hidden");
            document.getElementById("adminScreen").classList.add("hidden");
        }

        function showAdmin() {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("adminScreen").classList.remove("hidden");
        }

        function setLoginLoading(loading) {
            const loginBtn = document.getElementById("loginBtn");
            loginBtn.disabled = loading;
            loginBtn.innerHTML = loading
                ? '<i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังเข้าสู่ระบบ...'
                : "เข้าสู่ระบบ";
        }

        function populateStatusFilters(options) {
            statusOptions = options || [];
            const filter = document.getElementById("filterStatus");
            const edit = document.getElementById("editStatus");
            filter.innerHTML = '<option value="">ทุกสถานะ</option>';
            edit.innerHTML = "";
            statusOptions.forEach(function (s) {
                filter.innerHTML += '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>';
                edit.innerHTML += '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>';
            });
        }

        function renderCard(report) {
            const cls = STATUS_COLORS[report.status] || "bg-gray-100 text-gray-700";
            const detailPreview = String(report.detail || "").trim();
            const card = document.createElement("button");
            card.type = "button";
            card.className = "w-full text-left bg-white border border-gray-200 rounded-2xl p-4 hover:border-blue-300 hover:shadow-md transition-all active:scale-[0.99]";
            card.innerHTML =
                '<div class="flex items-start justify-between gap-2 mb-1">' +
                '<p class="font-semibold text-gray-800 line-clamp-1">' + escapeHtml(report.category) + '</p>' +
                '<span class="shrink-0 px-2 py-0.5 rounded-full text-xs font-semibold ' + cls + '">' + escapeHtml(report.status) + '</span>' +
                '</div>' +
                '<p class="text-sm text-gray-600">' + escapeHtml(report.name) + ' · ห้อง ' + escapeHtml(report.room) + ' เลขที่ ' + escapeHtml(report.studentNo) + '</p>' +
                (detailPreview ?
                    '<p class="text-sm text-gray-500 mt-2 line-clamp-2">' + escapeHtml(detailPreview) + '</p>' : '') +
                '<div class="flex items-center justify-between mt-2 gap-2">' +
                '<p class="text-xs text-gray-400">' + escapeHtml(report.date) + ' ' + escapeHtml(report.time) + '</p>' +
                (report.imageCount > 0 ?
                    '<span class="text-xs text-gray-400 shrink-0"><i class="fa-regular fa-image mr-0.5"></i>' + report.imageCount + '</span>' : '') +
                '</div>' +
                '<p class="text-xs font-mono text-blue-700 mt-1 truncate">' + escapeHtml(formatSubmitIdDisplay(report.submitId)) + '</p>' +
                '<p class="text-xs text-blue-600 mt-2 font-medium"><i class="fa-solid fa-chevron-right text-[10px] mr-1"></i>แตะเพื่อดูรายละเอียด</p>';
            card.addEventListener("click", function () { showDetail(report); });
            return card;
        }

        function applyReportsResult(result) {
            document.getElementById("listLoading").classList.add("hidden");
            if (result.statusOptions) populateStatusFilters(result.statusOptions);

            const listEl = document.getElementById("reportList");
            listEl.innerHTML = "";

            if (!result.reports || result.reports.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 py-8">ไม่พบเรื่อง</p>';
                return;
            }

            result.reports.forEach(function (r) { listEl.appendChild(renderCard(r)); });
        }

        async function login() {
            const password = document.getElementById("adminPassword").value;
            const errEl = document.getElementById("loginError");
            errEl.classList.add("hidden");
            setLoginLoading(true);

            try {
                const result = await postToGas({
                    action: "adminBootstrap",
                    password: password,
                    filterStatus: document.getElementById("filterStatus").value,
                    search: document.getElementById("searchInput").value.trim()
                });

                if (result.status !== "success") {
                    errEl.textContent = result.message || "เข้าสู่ระบบไม่สำเร็จ";
                    errEl.classList.remove("hidden");
                    return;
                }

                adminToken = result.adminToken;
                sessionStorage.setItem("udfondue_admin_token", adminToken);
                showAdmin();
                applyReportsResult(result);
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove("hidden");
            } finally {
                setLoginLoading(false);
            }
        }

        function logout() {
            adminToken = "";
            sessionStorage.removeItem("udfondue_admin_token");
            document.getElementById("adminPassword").value = "";
            showLogin();
        }

        async function loadReports() {
            document.getElementById("listLoading").classList.remove("hidden");
            document.getElementById("reportList").innerHTML = "";

            try {
                const result = await postToGas({
                    action: "adminBootstrap",
                    adminToken: adminToken,
                    filterStatus: document.getElementById("filterStatus").value,
                    search: document.getElementById("searchInput").value.trim()
                });

                document.getElementById("listLoading").classList.add("hidden");

                if (result.status !== "success") {
                    if (result.message && result.message.indexOf("เข้าสู่ระบบ") !== -1) logout();
                    document.getElementById("reportList").innerHTML = '<p class="text-center text-red-500 py-8">' + escapeHtml(result.message) + '</p>';
                    return;
                }

                applyReportsResult(result);
            } catch (err) {
                document.getElementById("listLoading").classList.add("hidden");
                document.getElementById("reportList").innerHTML = '<p class="text-center text-red-500 py-8">' + escapeHtml(err.message) + '</p>';
            }
        }

        function openEdit(report) {
            const r = report || currentReport;
            if (!r) return;
            currentEditId = r.submitId;
            document.getElementById("editSummary").innerHTML =
                '<strong>' + escapeHtml(r.category) + '</strong><br>' +
                escapeHtml(r.name) + ' · ห้อง ' + escapeHtml(r.room) + '<br>' +
                '<span class="font-mono text-xs">' + escapeHtml(formatSubmitIdDisplay(r.submitId)) + '</span>';
            document.getElementById("editStatus").value = r.status;
            document.getElementById("editNote").value = r.adminNote || "";
            openEditModal();
        }

        function openEditFromDetail() {
            closeDetailModal();
            setTimeout(function () {
                openEdit(currentReport);
            }, 330);
        }

        async function saveUpdate() {
            if (!currentEditId) return;
            const saveBtn = document.getElementById("saveBtn");
            saveBtn.disabled = true;

            try {
                const result = await postToGas({
                    action: "adminUpdate",
                    adminToken: adminToken,
                    submitId: currentEditId,
                    status: document.getElementById("editStatus").value,
                    adminNote: document.getElementById("editNote").value.trim()
                });

                if (result.status !== "success") {
                    alert(result.message || "บันทึกไม่สำเร็จ");
                    return;
                }

                closeEditModal();
                loadReports();
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            } finally {
                saveBtn.disabled = false;
            }
        }

        document.getElementById("loginBtn").addEventListener("click", login);
        document.getElementById("adminPassword").addEventListener("keydown", function (e) {
            if (e.key === "Enter") login();
        });
        document.getElementById("logoutBtn").addEventListener("click", logout);
        document.getElementById("refreshBtn").addEventListener("click", loadReports);
        document.getElementById("filterStatus").addEventListener("change", loadReports);
        document.getElementById("searchInput").addEventListener("keydown", function (e) {
            if (e.key === "Enter") loadReports();
        });
        document.getElementById("closeDetail").addEventListener("click", closeDetailModal);
        document.getElementById("detailCloseBtn").addEventListener("click", closeDetailModal);
        document.getElementById("detailBackdrop").addEventListener("click", closeDetailModal);
        document.getElementById("detailEditBtn").addEventListener("click", openEditFromDetail);
        document.getElementById("closeLightbox").addEventListener("click", closeLightbox);
        document.getElementById("imageLightbox").addEventListener("click", function (e) {
            if (e.target.id === "imageLightbox") closeLightbox();
        });
        document.getElementById("closeEdit").addEventListener("click", closeEditModal);
        document.getElementById("editBackdrop").addEventListener("click", closeEditModal);
        document.getElementById("saveBtn").addEventListener("click", saveUpdate);

        if (adminToken) {
            showAdmin();
            loadReports();
        } else {
            showLogin();
        }
    </script>
</body>
</html>
