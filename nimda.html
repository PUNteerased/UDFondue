<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDFondue | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #eef2f7; }
    </style>
</head>
<body class="min-h-screen">
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-100 text-blue-800 mb-3">
                    <i class="fa-solid fa-user-shield text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800">UDFondue Admin</h1>
                <p class="text-sm text-gray-400 mt-1">เข้าสู่ระบบเจ้าหน้าที่</p>
            </div>
            <input type="password" id="adminPassword" placeholder="รหัสผ่าน Admin"
                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-800/20 focus:border-blue-800 outline-none mb-4">
            <button type="button" id="loginBtn"
                class="w-full bg-gradient-to-r from-blue-900 to-blue-700 text-white font-semibold py-3 rounded-xl hover:from-blue-950 hover:to-blue-800 transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                เข้าสู่ระบบ
            </button>
            <p id="loginError" class="hidden text-sm text-red-500 text-center mt-3"></p>
        </div>
    </div>

    <div id="adminScreen" class="hidden min-h-screen flex flex-col">
        <div class="bg-gradient-to-r from-blue-900 to-blue-700 text-white px-6 py-5">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold">จัดการเรื่องแจ้ง</h1>
                    <p class="text-xs text-blue-100 mt-0.5">UDFondue Admin Panel</p>
                </div>
                <button type="button" id="logoutBtn" class="text-sm bg-white/20 px-3 py-1.5 rounded-lg hover:bg-white/30 transition-colors">
                    ออกจากระบบ
                </button>
            </div>
        </div>

        <div class="max-w-4xl mx-auto w-full px-4 py-5 flex-1">
            <div class="flex flex-col sm:flex-row gap-2 mb-4">
                <select id="filterStatus" class="px-4 py-2.5 rounded-xl border border-gray-200 bg-white outline-none text-sm">
                    <option value="">ทุกสถานะ</option>
                </select>
                <input type="text" id="searchInput" placeholder="ค้นหา ชื่อ / ห้อง / เลขที่แจ้ง..."
                    class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 outline-none text-sm focus:border-blue-800">
                <button type="button" id="refreshBtn" class="px-4 py-2.5 rounded-xl bg-blue-800 text-white text-sm font-semibold hover:bg-blue-900">
                    <i class="fa-solid fa-rotate-right"></i> รีเฟรช
                </button>
            </div>

            <div id="listLoading" class="text-center py-12 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
            </div>
            <div id="reportList" class="space-y-3"></div>
        </div>
    </div>

    <div id="editModal" class="hidden fixed inset-0 z-50">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="editBackdrop"></div>
        <div class="absolute bottom-0 sm:bottom-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 left-0 right-0 bg-white sm:rounded-3xl sm:max-w-lg sm:w-full rounded-t-3xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
                <h3 class="font-bold text-gray-800">อัปเดตสถานะ</h3>
                <button type="button" id="closeEdit" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div id="editSummary" class="text-sm text-gray-600 bg-gray-50 rounded-xl p-3"></div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">สถานะ</label>
                    <select id="editStatus" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 outline-none"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">หมายเหตุเจ้าหน้าที่</label>
                    <textarea id="editNote" rows="3" placeholder="ข้อความถึงนักเรียน (ถ้ามี)..."
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 outline-none resize-none"></textarea>
                </div>
                <button type="button" id="saveBtn"
                    class="w-full bg-gradient-to-r from-blue-900 to-blue-700 text-white font-semibold py-3 rounded-xl hover:from-blue-950 transition-all">
                    บันทึก
                </button>
            </div>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7enhoj1gHCAzzVIq-gm4_3PkFbRk3o3Ex8-rfQ4eClGpsrg44RAN0vnpg4JEIYSY/exec";

        let adminToken = sessionStorage.getItem("udfondue_admin_token") || "";
        let statusOptions = [];
        let currentEditId = "";

        const STATUS_COLORS = {
            "รับเรื่องแล้ว": "bg-blue-100 text-blue-800",
            "กำลังดำเนินการ": "bg-amber-100 text-amber-800",
            "รอข้อมูลเพิ่ม": "bg-orange-100 text-orange-800",
            "เสร็จสิ้น": "bg-green-100 text-green-800",
            "ปิดเรื่อง": "bg-gray-200 text-gray-700"
        };

        async function postToGas(payload) {
            const response = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            return response.json();
        }

        function escapeHtml(str) {
            return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatSubmitIdDisplay(id) {
            const s = String(id || "");
            if (s.indexOf("-U") !== -1) return s.split("-")[0];
            return s;
        }

        function showLogin() {
            document.getElementById("loginScreen").classList.remove("hidden");
            document.getElementById("adminScreen").classList.add("hidden");
        }

        function showAdmin() {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("adminScreen").classList.remove("hidden");
        }

        function setLoginLoading(loading) {
            const loginBtn = document.getElementById("loginBtn");
            loginBtn.disabled = loading;
            loginBtn.innerHTML = loading
                ? '<i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังเข้าสู่ระบบ...'
                : "เข้าสู่ระบบ";
        }

        function populateStatusFilters(options) {
            statusOptions = options || [];
            const filter = document.getElementById("filterStatus");
            const edit = document.getElementById("editStatus");
            filter.innerHTML = '<option value="">ทุกสถานะ</option>';
            edit.innerHTML = "";
            statusOptions.forEach(function (s) {
                filter.innerHTML += '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>';
                edit.innerHTML += '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>';
            });
        }

        function renderCard(report) {
            const cls = STATUS_COLORS[report.status] || "bg-gray-100 text-gray-700";
            const card = document.createElement("button");
            card.type = "button";
            card.className = "w-full text-left bg-white border border-gray-200 rounded-2xl p-4 hover:border-blue-300 hover:shadow transition-all";
            card.innerHTML =
                '<div class="flex items-start justify-between gap-2 mb-1">' +
                '<p class="font-semibold text-gray-800">' + escapeHtml(report.category) + '</p>' +
                '<span class="shrink-0 px-2 py-0.5 rounded-full text-xs font-semibold ' + cls + '">' + escapeHtml(report.status) + '</span>' +
                '</div>' +
                '<p class="text-sm text-gray-600">' + escapeHtml(report.name) + ' · ห้อง ' + escapeHtml(report.room) + ' เลขที่ ' + escapeHtml(report.studentNo) + '</p>' +
                '<p class="text-xs text-gray-400 mt-1">' + escapeHtml(report.date) + ' ' + escapeHtml(report.time) + '</p>' +
                '<p class="text-xs font-mono text-blue-700 mt-1 truncate">' + escapeHtml(formatSubmitIdDisplay(report.submitId)) + '</p>';
            card.addEventListener("click", function () { openEdit(report); });
            return card;
        }

        function applyReportsResult(result) {
            document.getElementById("listLoading").classList.add("hidden");
            if (result.statusOptions) populateStatusFilters(result.statusOptions);

            const listEl = document.getElementById("reportList");
            listEl.innerHTML = "";

            if (!result.reports || result.reports.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 py-8">ไม่พบเรื่อง</p>';
                return;
            }

            result.reports.forEach(function (r) { listEl.appendChild(renderCard(r)); });
        }

        async function login() {
            const password = document.getElementById("adminPassword").value;
            const errEl = document.getElementById("loginError");
            errEl.classList.add("hidden");
            setLoginLoading(true);

            try {
                const result = await postToGas({
                    action: "adminBootstrap",
                    password: password,
                    filterStatus: document.getElementById("filterStatus").value,
                    search: document.getElementById("searchInput").value.trim()
                });

                if (result.status !== "success") {
                    errEl.textContent = result.message || "เข้าสู่ระบบไม่สำเร็จ";
                    errEl.classList.remove("hidden");
                    return;
                }

                adminToken = result.adminToken;
                sessionStorage.setItem("udfondue_admin_token", adminToken);
                showAdmin();
                applyReportsResult(result);
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove("hidden");
            } finally {
                setLoginLoading(false);
            }
        }

        function logout() {
            adminToken = "";
            sessionStorage.removeItem("udfondue_admin_token");
            document.getElementById("adminPassword").value = "";
            showLogin();
        }

        async function loadReports() {
            document.getElementById("listLoading").classList.remove("hidden");
            document.getElementById("reportList").innerHTML = "";

            try {
                const result = await postToGas({
                    action: "adminBootstrap",
                    adminToken: adminToken,
                    filterStatus: document.getElementById("filterStatus").value,
                    search: document.getElementById("searchInput").value.trim()
                });

                document.getElementById("listLoading").classList.add("hidden");

                if (result.status !== "success") {
                    if (result.message && result.message.indexOf("เข้าสู่ระบบ") !== -1) logout();
                    document.getElementById("reportList").innerHTML = '<p class="text-center text-red-500 py-8">' + escapeHtml(result.message) + '</p>';
                    return;
                }

                applyReportsResult(result);
            } catch (err) {
                document.getElementById("listLoading").classList.add("hidden");
                document.getElementById("reportList").innerHTML = '<p class="text-center text-red-500 py-8">' + escapeHtml(err.message) + '</p>';
            }
        }

        function openEdit(report) {
            currentEditId = report.submitId;
            document.getElementById("editSummary").innerHTML =
                '<strong>' + escapeHtml(report.category) + '</strong><br>' +
                escapeHtml(report.name) + ' · ห้อง ' + escapeHtml(report.room) + '<br>' +
                '<span class="font-mono text-xs">' + escapeHtml(formatSubmitIdDisplay(report.submitId)) + '</span>';
            document.getElementById("editStatus").value = report.status;
            document.getElementById("editNote").value = report.adminNote || "";
            document.getElementById("editModal").classList.remove("hidden");
        }

        function closeEditModal() {
            document.getElementById("editModal").classList.add("hidden");
            currentEditId = "";
        }

        async function saveUpdate() {
            if (!currentEditId) return;
            const saveBtn = document.getElementById("saveBtn");
            saveBtn.disabled = true;

            try {
                const result = await postToGas({
                    action: "adminUpdate",
                    adminToken: adminToken,
                    submitId: currentEditId,
                    status: document.getElementById("editStatus").value,
                    adminNote: document.getElementById("editNote").value.trim()
                });

                if (result.status !== "success") {
                    alert(result.message || "บันทึกไม่สำเร็จ");
                    return;
                }

                closeEditModal();
                loadReports();
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            } finally {
                saveBtn.disabled = false;
            }
        }

        document.getElementById("loginBtn").addEventListener("click", login);
        document.getElementById("adminPassword").addEventListener("keydown", function (e) {
            if (e.key === "Enter") login();
        });
        document.getElementById("logoutBtn").addEventListener("click", logout);
        document.getElementById("refreshBtn").addEventListener("click", loadReports);
        document.getElementById("filterStatus").addEventListener("change", loadReports);
        document.getElementById("searchInput").addEventListener("keydown", function (e) {
            if (e.key === "Enter") loadReports();
        });
        document.getElementById("closeEdit").addEventListener("click", closeEditModal);
        document.getElementById("editBackdrop").addEventListener("click", closeEditModal);
        document.getElementById("saveBtn").addEventListener("click", saveUpdate);

        if (adminToken) {
            showAdmin();
            loadReports();
        } else {
            showLogin();
        }
    </script>
</body>
</html>
