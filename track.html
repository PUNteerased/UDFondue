<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDFondue | ติดตามเรื่อง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #eef2f7; }
        .tab-btn.active { background-color: #1e3a8a; color: #fff; }

        #detailModalPanel {
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #detailModalPanel.is-open {
            transform: translateY(0);
        }
        #detailModalBackdrop {
            opacity: 0;
            transition: opacity 0.28s ease;
        }
        #detailModalBackdrop.is-open {
            opacity: 1;
        }

        #imageLightbox {
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        #imageLightbox.is-open {
            opacity: 1;
        }
        #imageLightboxImg {
            transform: scale(0.92);
            transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #imageLightbox.is-open #imageLightboxImg {
            transform: scale(1);
        }

        .report-card-enter {
            animation: cardEnter 0.45s cubic-bezier(0.32, 0.72, 0, 1) both;
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-panel {
            animation: panelFade 0.28s ease both;
        }
        @keyframes panelFade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .track-image {
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .track-image.is-loaded {
            opacity: 1;
        }
        .track-image-skeleton {
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div class="bg-white w-full min-h-screen flex flex-col">
        <div class="bg-gradient-to-r from-blue-900 to-blue-700 text-white">
            <div class="w-full max-w-2xl mx-auto px-6 py-8 text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/20 mb-3 backdrop-blur-sm">
                    <i class="fa-solid fa-magnifying-glass text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold">ติดตามเรื่อง</h1>
                <p class="text-sm text-blue-100 mt-1">UDFondue — ดูสถานะเรื่องที่แจ้งไว้</p>
            </div>
        </div>

        <div class="w-full max-w-2xl mx-auto px-6 py-6 flex-1">
            <div class="flex gap-2 p-1 bg-gray-100 rounded-xl mb-5">
                <button type="button" id="tabMyList" class="tab-btn active flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all">
                    เรื่องของฉัน
                </button>
                <button type="button" id="tabSearch" class="tab-btn flex-1 py-2.5 rounded-lg text-sm font-semibold text-gray-600 transition-all">
                    ค้นหาเลขที่แจ้ง
                </button>
            </div>

            <div id="panelMyList" class="tab-panel">
                <div id="listLoading" class="text-center py-12 text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                    <p class="text-sm">กำลังโหลด...</p>
                </div>
                <div id="listEmpty" class="hidden text-center py-12">
                    <i class="fa-regular fa-folder-open text-4xl text-gray-300 mb-3"></i>
                    <p class="text-gray-500 font-medium">ยังไม่มีเรื่องที่แจ้ง</p>
                    <p class="text-xs text-gray-400 mt-1">แจ้งเรื่องผ่านเมนู "แจ้งปัญหา" ใน LINE</p>
                </div>
                <div id="reportList" class="space-y-3"></div>
            </div>

            <div id="panelSearch" class="hidden tab-panel">
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-solid fa-hashtag mr-1 text-blue-800"></i> เลขที่แจ้ง (Submit ID)
                </label>
                <div class="flex gap-2">
                    <input type="text" id="searchSubmitId" placeholder="เช่น UDF-A3B7K9M2"
                        class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-800/20 focus:border-blue-800 outline-none">
                    <button type="button" id="searchBtn"
                        class="px-4 py-2.5 rounded-xl bg-blue-800 text-white font-semibold hover:bg-blue-900 transition-colors">
                        ค้นหา
                    </button>
                </div>
                <p class="text-xs text-gray-400 mt-2">เลขที่แจ้งจะแสดงหลังส่งเรื่องสำเร็จ</p>
                <div id="searchResult" class="mt-4"></div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="hidden fixed inset-0 z-50">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="detailModalBackdrop"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl max-h-[90vh] overflow-y-auto" id="detailModalPanel">
            <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between z-10">
                <h3 class="text-lg font-bold text-gray-800">รายละเอียดเรื่อง</h3>
                <button type="button" id="closeDetail" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="detailContent" class="px-6 py-4 pb-8 space-y-4"></div>
        </div>
    </div>

    <div id="imageLightbox" class="hidden fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4">
        <button type="button" id="closeLightbox" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/15 text-white flex items-center justify-center hover:bg-white/25 transition-colors">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <img id="imageLightboxImg" src="" alt="รูปเต็มจอ" class="max-w-full max-h-[90vh] object-contain rounded-lg">
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7enhoj1gHCAzzVIq-gm4_3PkFbRk3o3Ex8-rfQ4eClGpsrg44RAN0vnpg4JEIYSY/exec";
        const LIFF_ID = "2010319415-VtukiTkR";

        let lineUserId = "";

        const STATUS_COLORS = {
            "รับเรื่องแล้ว": "bg-blue-100 text-blue-800",
            "กำลังดำเนินการ": "bg-amber-100 text-amber-800",
            "รอข้อมูลเพิ่ม": "bg-orange-100 text-orange-800",
            "เสร็จสิ้น": "bg-green-100 text-green-800",
            "ปิดเรื่อง": "bg-gray-200 text-gray-700"
        };

        async function postToGas(payload) {
            const response = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            return response.json();
        }

        function statusBadge(status) {
            const cls = STATUS_COLORS[status] || "bg-gray-100 text-gray-700";
            return '<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ' + cls + '">' + escapeHtml(status) + '</span>';
        }

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function formatSubmitIdDisplay(id) {
            const s = String(id || "");
            if (s.indexOf("-U") !== -1) return s.split("-")[0];
            return s;
        }

        function toEmbeddableDriveUrl(url) {
            const s = String(url || "").trim();
            if (s.indexOf("drive.google.com/thumbnail") !== -1) return s;
            const m = s.match(/\/file\/d\/([^/]+)/) || s.match(/[?&]id=([^&]+)/);
            if (m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200";
            return s;
        }

        function getDriveViewerUrl(url) {
            const s = String(url || "").trim();
            const m = s.match(/\/file\/d\/([^/]+)/) || s.match(/[?&]id=([^&]+)/);
            if (m) return "https://drive.google.com/file/d/" + m[1] + "/view";
            return s;
        }

        function buildImagesHtml(imageUrl) {
            const images = String(imageUrl || "").split("\n").filter(function (u) {
                return u && u.indexOf("http") === 0;
            });
            if (images.length === 0) return "";

            let html = '<div class="space-y-3"><p class="text-sm font-semibold text-gray-700">รูปภาพ</p>';
            images.forEach(function (rawUrl, idx) {
                const embedUrl = toEmbeddableDriveUrl(rawUrl);
                const viewerUrl = getDriveViewerUrl(rawUrl);
                html +=
                    '<div class="track-image-wrap relative rounded-xl border border-gray-200 bg-gray-100 overflow-hidden cursor-zoom-in min-h-[120px]"' +
                    ' data-embed-url="' + escapeHtml(embedUrl) + '"' +
                    ' data-viewer-url="' + escapeHtml(viewerUrl) + '">' +
                    '<div class="track-image-skeleton absolute inset-0 bg-gray-200"></div>' +
                    '<img src="' + escapeHtml(embedUrl) + '" alt="รูปประกอบ ' + (idx + 1) + '"' +
                    ' class="track-image relative w-full object-contain max-h-72"' +
                    ' loading="lazy" referrerpolicy="no-referrer">' +
                    '<div class="track-image-error hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-100 text-gray-500 text-sm gap-2">' +
                    '<i class="fa-regular fa-image text-2xl"></i>' +
                    '<a href="' + escapeHtml(viewerUrl) + '" target="_blank" rel="noopener" class="text-blue-700 underline">เปิดใน Drive</a>' +
                    '</div></div>';
            });
            html += '</div>';
            return html;
        }

        function bindTrackImages(container) {
            container.querySelectorAll(".track-image-wrap").forEach(function (wrap) {
                const img = wrap.querySelector(".track-image");
                const skeleton = wrap.querySelector(".track-image-skeleton");
                const errorEl = wrap.querySelector(".track-image-error");

                function showError() {
                    if (skeleton) skeleton.classList.add("hidden");
                    img.classList.add("hidden");
                    errorEl.classList.remove("hidden");
                }

                img.addEventListener("load", function () {
                    if (skeleton) skeleton.classList.add("hidden");
                    img.classList.add("is-loaded");
                });
                img.addEventListener("error", showError);

                if (img.complete && img.naturalWidth > 0) {
                    if (skeleton) skeleton.classList.add("hidden");
                    img.classList.add("is-loaded");
                } else if (img.complete) {
                    showError();
                }

                wrap.addEventListener("click", function () {
                    if (img.classList.contains("is-loaded")) {
                        openLightbox(img.src);
                    }
                });
            });
        }

        function openDetailModal() {
            const modal = document.getElementById("detailModal");
            const backdrop = document.getElementById("detailModalBackdrop");
            const panel = document.getElementById("detailModalPanel");
            modal.classList.remove("hidden");
            requestAnimationFrame(function () {
                backdrop.classList.add("is-open");
                panel.classList.add("is-open");
            });
        }

        function closeDetailModal() {
            const modal = document.getElementById("detailModal");
            const backdrop = document.getElementById("detailModalBackdrop");
            const panel = document.getElementById("detailModalPanel");
            backdrop.classList.remove("is-open");
            panel.classList.remove("is-open");
            setTimeout(function () {
                modal.classList.add("hidden");
            }, 320);
        }

        function openLightbox(src) {
            const lb = document.getElementById("imageLightbox");
            const img = document.getElementById("imageLightboxImg");
            img.src = src;
            lb.classList.remove("hidden");
            requestAnimationFrame(function () {
                lb.classList.add("is-open");
            });
        }

        function closeLightbox() {
            const lb = document.getElementById("imageLightbox");
            lb.classList.remove("is-open");
            setTimeout(function () {
                lb.classList.add("hidden");
                document.getElementById("imageLightboxImg").src = "";
            }, 250);
        }

        function renderReportCard(report, index) {
            const card = document.createElement("button");
            card.type = "button";
            const delay = Math.min((index || 0) * 0.06, 0.36);
            card.className = "report-card-enter w-full text-left bg-white border border-gray-200 rounded-2xl p-4 hover:border-blue-300 hover:shadow-md transition-all";
            card.style.animationDelay = delay + "s";
            card.innerHTML =
                '<div class="flex items-start justify-between gap-2 mb-2">' +
                '<p class="font-semibold text-gray-800 line-clamp-1">' + escapeHtml(report.category) + '</p>' +
                statusBadge(report.status) +
                '</div>' +
                '<p class="text-xs text-gray-400">' + escapeHtml(report.date) + ' ' + escapeHtml(report.time) + '</p>' +
                '<p class="text-xs text-gray-500 mt-1">ห้อง ' + escapeHtml(report.room) + ' เลขที่ ' + escapeHtml(report.studentNo) + '</p>' +
                '<p class="text-xs text-blue-700 mt-2 font-mono truncate">' + escapeHtml(formatSubmitIdDisplay(report.submitId)) + '</p>';
            card.addEventListener("click", function () { showDetail(report); });
            return card;
        }

        function showDetail(report) {
            const content = document.getElementById("detailContent");
            content.innerHTML =
                '<div class="flex items-center justify-between">' +
                statusBadge(report.status) +
                '<span class="text-xs text-gray-400">' + escapeHtml(report.statusUpdated) + '</span>' +
                '</div>' +
                '<div><p class="text-xs text-gray-400">เลขที่แจ้ง</p><p class="font-mono text-sm text-blue-800 break-all">' + escapeHtml(formatSubmitIdDisplay(report.submitId)) + '</p></div>' +
                '<div><p class="text-xs text-gray-400">ประเภทเรื่อง</p><p class="font-semibold text-gray-800">' + escapeHtml(report.category) + '</p></div>' +
                '<div><p class="text-xs text-gray-400">ผู้แจ้ง / ห้อง / เลขที่</p><p class="text-sm text-gray-700">' + escapeHtml(report.name) + ' · ห้อง ' + escapeHtml(report.room) + ' เลขที่ ' + escapeHtml(report.studentNo) + '</p></div>' +
                '<div><p class="text-xs text-gray-400">รายละเอียด</p><p class="text-sm text-gray-700 whitespace-pre-wrap">' + escapeHtml(report.detail) + '</p></div>' +
                (report.adminNote ? '<div class="bg-blue-50 rounded-xl p-3"><p class="text-xs text-blue-800 font-semibold mb-1"><i class="fa-solid fa-user-tie mr-1"></i>หมายเหตุเจ้าหน้าที่</p><p class="text-sm text-gray-700 whitespace-pre-wrap">' + escapeHtml(report.adminNote) + '</p></div>' : '') +
                buildImagesHtml(report.imageUrl);

            bindTrackImages(content);
            openDetailModal();
        }

        async function loadMyReports() {
            document.getElementById("listLoading").classList.remove("hidden");
            document.getElementById("listEmpty").classList.add("hidden");
            document.getElementById("reportList").innerHTML = "";

            try {
                const result = await postToGas({ action: "trackList", lineId: lineUserId });
                document.getElementById("listLoading").classList.add("hidden");

                if (result.status !== "success") {
                    document.getElementById("listEmpty").classList.remove("hidden");
                    document.getElementById("listEmpty").querySelector("p").textContent = result.message || "โหลดไม่สำเร็จ";
                    return;
                }

                if (!result.reports || result.reports.length === 0) {
                    document.getElementById("listEmpty").classList.remove("hidden");
                    return;
                }

                const list = document.getElementById("reportList");
                result.reports.forEach(function (report, index) {
                    list.appendChild(renderReportCard(report, index));
                });
            } catch (err) {
                document.getElementById("listLoading").classList.add("hidden");
                document.getElementById("listEmpty").classList.remove("hidden");
                document.getElementById("listEmpty").querySelector("p").textContent = "เกิดข้อผิดพลาด: " + err.message;
            }
        }

        async function searchBySubmitId() {
            const submitId = document.getElementById("searchSubmitId").value.trim();
            const container = document.getElementById("searchResult");

            if (!submitId) {
                alert("กรุณากรอกเลขที่แจ้ง");
                return;
            }

            container.innerHTML = '<p class="text-center text-gray-400 py-6"><i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังค้นหา...</p>';

            try {
                const result = await postToGas({
                    action: "trackDetail",
                    lineId: lineUserId,
                    submitId: submitId
                });

                if (result.status !== "success") {
                    container.innerHTML = '<p class="text-center text-red-500 py-6">' + escapeHtml(result.message) + '</p>';
                    return;
                }

                container.innerHTML = "";
                container.appendChild(renderReportCard(result.report, 0));
            } catch (err) {
                container.innerHTML = '<p class="text-center text-red-500 py-6">เกิดข้อผิดพลาด: ' + escapeHtml(err.message) + '</p>';
            }
        }

        function switchTab(tab) {
            const isMyList = tab === "myList";
            document.getElementById("tabMyList").classList.toggle("active", isMyList);
            document.getElementById("tabSearch").classList.toggle("active", !isMyList);
            document.getElementById("tabMyList").classList.toggle("text-gray-600", !isMyList);
            document.getElementById("tabSearch").classList.toggle("text-gray-600", isMyList);

            const panelMyList = document.getElementById("panelMyList");
            const panelSearch = document.getElementById("panelSearch");
            panelMyList.classList.toggle("hidden", !isMyList);
            panelSearch.classList.toggle("hidden", isMyList);
            panelMyList.classList.remove("tab-panel");
            panelSearch.classList.remove("tab-panel");
            void panelMyList.offsetWidth;
            if (isMyList) panelMyList.classList.add("tab-panel");
            else panelSearch.classList.add("tab-panel");
        }

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                lineUserId = profile.userId;
            } catch (error) {
                console.error("LIFF init failed:", error);
                lineUserId = "U-TEST-USER-ID";
            }
            loadMyReports();
        }

        document.getElementById("tabMyList").addEventListener("click", function () { switchTab("myList"); });
        document.getElementById("tabSearch").addEventListener("click", function () { switchTab("search"); });
        document.getElementById("searchBtn").addEventListener("click", searchBySubmitId);
        document.getElementById("closeDetail").addEventListener("click", closeDetailModal);
        document.getElementById("detailModalBackdrop").addEventListener("click", closeDetailModal);
        document.getElementById("closeLightbox").addEventListener("click", closeLightbox);
        document.getElementById("imageLightbox").addEventListener("click", function (e) {
            if (e.target.id === "imageLightbox") closeLightbox();
        });
        document.getElementById("searchSubmitId").addEventListener("keydown", function (e) {
            if (e.key === "Enter") searchBySubmitId();
        });

        window.onload = initLiff;
    </script>
</body>
</html>
