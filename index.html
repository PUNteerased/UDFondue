<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>UDFondue | ระบบแจ้งเรื่องนักเรียน</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body {
            font-family: 'Anuphan', sans-serif;
            background-color: #eef2f7;
        }
        .category-card input:checked + .category-body {
            border-color: #1e3a8a;
            background-color: #eff3fb;
            box-shadow: 0 4px 14px rgba(30, 58, 138, 0.18);
        }
        .category-card input:checked + .category-body .cat-icon {
            background-color: #1e3a8a;
            color: #ffffff;
        }
        .category-card input:checked + .category-body .cat-check {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div class="bg-white w-full min-h-screen flex flex-col">

        <div class="bg-gradient-to-r from-blue-900 to-blue-700 text-white">
            <div class="w-full max-w-2xl mx-auto px-6 py-8 sm:py-10 text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-white/20 mb-3 backdrop-blur-sm">
                    <i class="fa-solid fa-comment-dots text-3xl sm:text-4xl"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold">UDFondue</h1>
                <p class="text-sm sm:text-base text-blue-100 mt-1">ระบบแจ้งเรื่อง • ตามหาของหาย • เสนอความเห็น</p>
            </div>
        </div>

        <form id="reportForm" class="w-full max-w-2xl mx-auto px-6 py-8 space-y-6 flex-1">

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-regular fa-user mr-1 text-blue-800"></i> ชื่อผู้แจ้ง
                </label>
                <input type="text" id="reporterName" required readonly
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-gray-500 focus:outline-none">
                <input type="hidden" id="lineUserId">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-solid fa-door-open mr-1 text-blue-800"></i> ห้อง
                </label>
                <input type="text" id="roomNumber" required
                    placeholder="เช่น 4/5, 5/6, 6/7"
                    pattern="^\d+/\d+$"
                    title="รูปแบบห้อง เช่น 5/6 หรือ 6/7"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-800/20 focus:border-blue-800 transition-all outline-none">
                <p class="text-xs text-gray-400 mt-1">รูปแบบ ชั้น/ห้อง เช่น 6/7 ซิกเซเว่นนน</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-solid fa-hashtag mr-1 text-blue-800"></i> เลขที่
                </label>
                <input type="text" id="studentNumber" required
                    placeholder="เช่น 15, 23"
                    inputmode="numeric"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-800/20 focus:border-blue-800 transition-all outline-none">
                <p class="text-xs text-gray-400 mt-1">เลขที่นักเรียนในห้อง</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fa-solid fa-layer-group mr-1 text-blue-800"></i> เลือกประเภทเรื่องที่ต้องการแจ้ง
                </label>
                <div class="space-y-3">
                    <label class="category-card block cursor-pointer">
                        <input type="radio" name="mainCategory" value="ปัญหาที่พบ" class="hidden" required>
                        <div class="category-body flex items-center gap-3 border-2 border-gray-200 rounded-2xl p-3.5 transition-all">
                            <span class="cat-icon flex items-center justify-center w-11 h-11 rounded-xl bg-gray-100 text-blue-800 text-lg shrink-0 transition-all">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </span>
                            <div class="flex-1">
                                <p class="font-semibold text-gray-800">ปัญหาที่พบ</p>
                                <p class="text-xs text-gray-500">แจ้งสิ่งชำรุด เสียหาย หรือปัญหาในโรงเรียน</p>
                            </div>
                            <i class="cat-check fa-solid fa-circle-check text-blue-800 opacity-0 transition-opacity"></i>
                        </div>
                    </label>

                    <label class="category-card block cursor-pointer">
                        <input type="radio" name="mainCategory" value="ตามหาของหาย" class="hidden">
                        <div class="category-body flex items-center gap-3 border-2 border-gray-200 rounded-2xl p-3.5 transition-all">
                            <span class="cat-icon flex items-center justify-center w-11 h-11 rounded-xl bg-gray-100 text-blue-800 text-lg shrink-0 transition-all">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <div class="flex-1">
                                <p class="font-semibold text-gray-800">ตามหาของหาย</p>
                                <p class="text-xs text-gray-500">แจ้งของหาย หรือพบของที่มีผู้ทำหล่น</p>
                            </div>
                            <i class="cat-check fa-solid fa-circle-check text-blue-800 opacity-0 transition-opacity"></i>
                        </div>
                    </label>

                    <label class="category-card block cursor-pointer">
                        <input type="radio" name="mainCategory" value="เสนอความเห็นต่อสภานักเรียน" class="hidden">
                        <div class="category-body flex items-center gap-3 border-2 border-gray-200 rounded-2xl p-3.5 transition-all">
                            <span class="cat-icon flex items-center justify-center w-11 h-11 rounded-xl bg-gray-100 text-blue-800 text-lg shrink-0 transition-all">
                                <i class="fa-solid fa-lightbulb"></i>
                            </span>
                            <div class="flex-1">
                                <p class="font-semibold text-gray-800">เสนอความเห็นต่อสภานักเรียน</p>
                                <p class="text-xs text-gray-500">เสนอแนะ ความคิดเห็น หรือร้องเรียนถึงสภานักเรียน</p>
                            </div>
                            <i class="cat-check fa-solid fa-circle-check text-blue-800 opacity-0 transition-opacity"></i>
                        </div>
                    </label>

                    <label class="category-card block cursor-pointer">
                        <input type="radio" name="mainCategory" value="other" class="hidden">
                        <div class="category-body flex items-center gap-3 border-2 border-gray-200 rounded-2xl p-3.5 transition-all">
                            <span class="cat-icon flex items-center justify-center w-11 h-11 rounded-xl bg-gray-100 text-blue-800 text-lg shrink-0 transition-all">
                                <i class="fa-solid fa-ellipsis"></i>
                            </span>
                            <div class="flex-1">
                                <p class="font-semibold text-gray-800">อื่นๆ</p>
                                <p class="text-xs text-gray-500">ระบุหัวข้อเรื่องที่ต้องการแจ้งเอง</p>
                            </div>
                            <i class="cat-check fa-solid fa-circle-check text-blue-800 opacity-0 transition-opacity"></i>
                        </div>
                    </label>
                </div>

                <div id="otherCategoryWrapper" class="hidden mt-3">
                    <input type="text" id="otherCategoryInput" placeholder="ระบุหัวข้อเรื่องที่ต้องการแจ้ง..."
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-800/20 focus:border-blue-800 transition-all outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-regular fa-file-lines mr-1 text-blue-800"></i> รายละเอียด
                </label>
                <textarea id="issueDetail" rows="4" required placeholder="อธิบายเรื่องที่ต้องการแจ้งให้ละเอียด เช่น สถานที่ ลักษณะของหาย หรือข้อเสนอแนะ..."
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-800/20 focus:border-blue-800 transition-all outline-none resize-none"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-regular fa-image mr-1 text-blue-800"></i> แนบรูปภาพประกอบ
                    <span class="text-xs font-normal text-gray-400">(ไม่บังคับ)</span>
                </label>

                <input type="file" id="imageInput" accept="image/*" multiple onchange="previewImage(event)" class="hidden">

                <div id="uploadDropzone" class="relative group">
                    <label for="imageInput" class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 group-hover:border-blue-800 rounded-2xl p-6 cursor-pointer hover:bg-blue-50/40 transition-all duration-300">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 group-hover:text-blue-800 mb-2"></i>
                        <span class="text-sm font-medium text-gray-600 group-hover:text-blue-800">กดเพื่อเลือกรูปภาพ หรือ ถ่ายรูป</span>
                        <span class="text-xs text-gray-400 mt-1">สูงสุด 5 รูป • JPEG, PNG ขนาดไม่เกิน 10MB ต่อรูป</span>
                    </label>
                </div>

                <div id="previewContainer" class="hidden">
                    <div id="previewGrid" class="space-y-3"></div>
                    <label for="imageInput" class="mt-3 flex items-center justify-center gap-2 py-2.5 rounded-xl border border-blue-800 text-blue-800 font-medium cursor-pointer hover:bg-blue-50 transition-colors">
                        <i class="fa-solid fa-plus"></i> เพิ่มรูป
                    </label>
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-gradient-to-r from-blue-900 to-blue-700 hover:from-blue-950 hover:to-blue-800 text-white font-semibold py-3 px-4 rounded-xl transition-all duration-300 shadow-md flex items-center justify-center gap-2 disabled:opacity-60">
                <i class="fa-solid fa-paper-plane"></i> ส่งเรื่อง
            </button>
        </form>
    </div>

    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center text-white">
        <div class="text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-300 mx-auto mb-4"></div>
            <h3 id="loadingTitle" class="text-lg font-semibold">กำลังบันทึกและส่งข้อมูล...</h3>
            <p id="loadingSubtitle" class="text-sm text-gray-300 mt-1">กรุณาอย่าปิดหน้านี้</p>
        </div>
    </div>

    <div id="successOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm mx-4 p-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-800 mb-4">
                <i class="fa-solid fa-circle-check text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold text-blue-900">ขอบคุณที่แจ้งปัญหา</h3>
            <p class="text-sm text-gray-500 mt-2">เราได้รับข้อมูลของคุณแล้ว</p>
            <button type="button" id="newReportBtn" class="hidden mt-6 w-full py-2.5 rounded-xl border border-blue-800 text-blue-800 font-medium hover:bg-blue-50 transition-colors">
                แจ้งเรื่องใหม่
            </button>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwNOi5ygN32j8LKxFsUV_o9O1hVdBp9tGOq7W1sxNOla2pD4cigyok_NtkDV02EvVo/exec";
        const LIFF_ID = "2010319415-epnUUdNV";
        const GAS_POST_DELAY_MS = 3000;

        const MAX_IMAGES = 5;
        const MAX_FILE_SIZE = 10 * 1024 * 1024;
        const MAX_DIMENSION = 1600;
        const JPEG_QUALITY = 0.8;
        let base64Images = [];

        function compressImage(file) {
            return new Promise(function (resolve, reject) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                            if (width > height) {
                                height = Math.round(height * (MAX_DIMENSION / width));
                                width = MAX_DIMENSION;
                            } else {
                                width = Math.round(width * (MAX_DIMENSION / height));
                                height = MAX_DIMENSION;
                            }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
                    };
                    img.onerror = function () { reject(new Error("โหลดรูปไม่สำเร็จ")); };
                    img.src = e.target.result;
                };
                reader.onerror = function () { reject(new Error("อ่านไฟล์ไม่สำเร็จ")); };
                reader.readAsDataURL(file);
            });
        }

        async function previewImage(event) {
            const input = event.target;
            const files = Array.from(input.files || []);
            input.value = "";
            if (files.length === 0) return;

            for (const file of files) {
                if (base64Images.length >= MAX_IMAGES) {
                    alert("แนบรูปได้สูงสุด " + MAX_IMAGES + " รูป");
                    break;
                }
                if (file.size > MAX_FILE_SIZE) {
                    alert('รูป "' + file.name + '" มีขนาดเกิน 10MB จึงข้ามรูปนี้');
                    continue;
                }
                try {
                    const compressed = await compressImage(file);
                    base64Images.push(compressed);
                    renderPreviews();
                } catch (err) {
                    alert('ไม่สามารถประมวลผลรูป "' + file.name + '" ได้');
                }
            }
        }

        function renderPreviews() {
            const grid = document.getElementById("previewGrid");
            const container = document.getElementById("previewContainer");
            const dropzone = document.getElementById("uploadDropzone");

            grid.innerHTML = "";
            base64Images.forEach(function (src, index) {
                const item = document.createElement("div");
                item.className = "relative rounded-2xl overflow-hidden border border-gray-200 bg-gray-50 flex items-center justify-center";
                item.innerHTML =
                    '<img src="' + src + '" alt="ภาพตัวอย่าง" class="w-full h-auto max-h-[60vh] object-contain">' +
                    '<button type="button" data-index="' + index + '" class="remove-img-btn absolute top-2 right-2 bg-red-500 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-red-600 transition-colors shadow-lg">' +
                    '<i class="fa-solid fa-trash-can text-sm"></i></button>';
                grid.appendChild(item);
            });

            grid.querySelectorAll(".remove-img-btn").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    removeImageAt(parseInt(btn.getAttribute("data-index"), 10));
                });
            });

            if (base64Images.length > 0) {
                container.classList.remove("hidden");
                dropzone.classList.add("hidden");
            } else {
                container.classList.add("hidden");
                dropzone.classList.remove("hidden");
            }
        }

        function removeImageAt(index) {
            base64Images.splice(index, 1);
            renderPreviews();
        }

        function resetImages() {
            base64Images = [];
            renderPreviews();
        }

        async function postToGas(payload) {
            await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            await new Promise(function (resolve) {
                setTimeout(resolve, payload.action === "uploadImage" ? GAS_POST_DELAY_MS : 1500);
            });
        }

        function setLoadingMessage(title, subtitle) {
            document.getElementById("loadingTitle").textContent = title;
            document.getElementById("loadingSubtitle").textContent = subtitle;
        }

        function showSuccess() {
            document.getElementById("loadingOverlay").classList.add("hidden");
            document.getElementById("successOverlay").classList.remove("hidden");

            if (typeof liff !== "undefined" && liff.isInClient()) {
                setTimeout(function () { liff.closeWindow(); }, 2000);
            } else {
                document.getElementById("newReportBtn").classList.remove("hidden");
            }
        }

        function resetForm() {
            document.getElementById("reportForm").reset();
            document.getElementById("otherCategoryWrapper").classList.add("hidden");
            document.getElementById("otherCategoryInput").removeAttribute("required");
            resetImages();
            document.getElementById("submitBtn").disabled = false;
            document.getElementById("successOverlay").classList.add("hidden");
            document.getElementById("newReportBtn").classList.add("hidden");
        }

        document.getElementById("newReportBtn").addEventListener("click", resetForm);

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    document.getElementById("reporterName").value = profile.displayName;
                    document.getElementById("lineUserId").value = profile.userId;
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error("LIFF Initialization failed", error);
                document.getElementById("reporterName").value = "ผู้ใช้งานจำลอง (เดสก์ท็อป)";
                document.getElementById("lineUserId").value = "U-TEST-USER-ID";
            }
        }

        window.onload = initLiff;

        document.querySelectorAll('input[name="mainCategory"]').forEach(function (radio) {
            radio.addEventListener("change", function () {
                const wrapper = document.getElementById("otherCategoryWrapper");
                const otherInput = document.getElementById("otherCategoryInput");
                if (radio.value === "other") {
                    wrapper.classList.remove("hidden");
                    otherInput.setAttribute("required", "required");
                } else {
                    wrapper.classList.add("hidden");
                    otherInput.removeAttribute("required");
                    otherInput.value = "";
                }
            });
        });

        document.getElementById("reportForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            const loadingOverlay = document.getElementById("loadingOverlay");
            const selectedCat = document.querySelector('input[name="mainCategory"]:checked');

            if (!selectedCat) {
                alert("กรุณาเลือกประเภทเรื่องที่ต้องการแจ้ง");
                return;
            }

            const otherCategoryValue = document.getElementById("otherCategoryInput").value.trim();
            if (selectedCat.value === "other" && !otherCategoryValue) {
                alert("กรุณาระบุหัวข้อเรื่องที่ต้องการแจ้ง");
                return;
            }

            loadingOverlay.classList.remove("hidden");
            submitBtn.disabled = true;

            const lineUserId = document.getElementById("lineUserId").value;
            const submitId = Date.now() + "-" + lineUserId;

            try {
                setLoadingMessage("กำลังบันทึกข้อมูล...", "กรุณาอย่าปิดหน้านี้");
                await postToGas({
                    action: "submit",
                    submitId: submitId,
                    lineId: lineUserId,
                    name: document.getElementById("reporterName").value,
                    room: document.getElementById("roomNumber").value.trim(),
                    studentNo: document.getElementById("studentNumber").value.trim(),
                    category: selectedCat.value,
                    otherCategory: otherCategoryValue,
                    detail: document.getElementById("issueDetail").value,
                    imageCount: base64Images.length
                });

                for (let i = 0; i < base64Images.length; i++) {
                    setLoadingMessage(
                        "กำลังส่งรูป " + (i + 1) + "/" + base64Images.length,
                        "กรุณาอย่าปิดหน้านี้"
                    );
                    await postToGas({
                        action: "uploadImage",
                        submitId: submitId,
                        imageIndex: i + 1,
                        image: base64Images[i]
                    });
                }

                showSuccess();

            } catch (error) {
                loadingOverlay.classList.add("hidden");
                submitBtn.disabled = false;
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + error.message);
            }
        });
    </script>
</body>
</html>
